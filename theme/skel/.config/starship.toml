# ==============================================================================
# NewbianOS Starship Prompt Configuration
# AI-Native Developer Experience with Git, Docker, Node, Python, Antigravity status
# ==============================================================================

format = """
[┌─](bold #00f0ff)$os$directory$git_branch$git_status$nodejs$python$rust$golang$docker_context$custom.antigravity
[└─](bold #00f0ff)$character"""

# Timeout in milliseconds
command_timeout = 1000

[character]
success_symbol = "[⚡](bold #00f0ff)"
error_symbol = "[✖](bold #ff007f)"

[os]
disabled = false
style = "bold #00f0ff"
format = "[$symbol ]($style)"

[os.symbols]
Debian = "🌀"
Linux = "🐧"

[directory]
style = "bold #ffffff"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bold #a855f7"
symbol = " "
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #ff007f"
format = "([$all_status$ahead_behind]($style) )"

[nodejs]
style = "bold #22c55e"
symbol = " "
format = "[$symbol($version )]($style)"

[python]
style = "bold #eab308"
symbol = " "
format = "[$symbol($version )]($style)"

[rust]
style = "bold #f97316"
symbol = " "
format = "[$symbol($version )]($style)"

[golang]
style = "bold #06b6d4"
symbol = " "
format = "[$symbol($version )]($style)"

[docker_context]
style = "bold #3b82f6"
symbol = " "
format = "[$symbol$context]($style) "

[custom.antigravity]
command = "echo '⚡AGY'"
when = "test -d .agents || test -f AGENTS.md"
style = "bold #00f0ff"
format = "[$output]($style) "
