name: CI & Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: 🧪 Lint & Unit Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install testing & desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils dosfstools mtools

      - name: 🔍 Lint shell scripts & desktop entries
        run: |
          make lint

      - name: 🧪 Run unit & integration test suites
        run: |
          make test
